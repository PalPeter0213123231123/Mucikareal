
<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🖕 💔</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: radial-gradient(circle, #292929, #050505);
      color: white;
      font-family: Arial, sans-serif;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    .symbols {
      display: flex;
      gap: 22px;
      font-size: clamp(76px, 15vw, 150px);
      animation: float 3s ease-in-out infinite;
      z-index: 2;
    }

    .symbols span:last-child {
      animation: pulse 1.8s infinite;
    }

    .decor {
      position: absolute;
      font-size: 40px;
      animation: drift 4s ease-in-out infinite alternate;
    }

    .d1 { top: 12%; left: 12%; }
    .d2 { top: 20%; right: 13%; }
    .d3 { top: 48%; left: 5%; }
    .d4 { top: 55%; right: 6%; }
    .d5 { bottom: 15%; left: 19%; }
    .d6 { bottom: 12%; right: 18%; }

    .message {
      position: absolute;
      bottom: 9%;
      width: 85%;
      max-width: 620px;
      text-align: center;
      font-size: 20px;
      line-height: 1.6;
      color: white;
      padding: 20px;
      background: rgba(255,255,255,0.08);
      border: 1px solid #555;
      border-radius: 14px;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    @keyframes drift {
      from { translate: 0 0; }
      to { translate: 0 -14px; }
    }
  </style>
</head>

<body>

  <main class="page">

    <span class="decor d1">🖕</span>
    <span class="decor d2">💔</span>
    <span class="decor d3">🖕</span>
    <span class="decor d4">🖕</span>
    <span class="decor d5">💔</span>
    <span class="decor d6">🖕</span>

    <div class="symbols">
      <span>🖕</span>
      <span>💔</span>
    </div>

    <div class="message">
      Ezt igy itt hagyom neked
    </div>

  </main>

</body>
</html>
